<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lighting Test</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #07090e;
    overflow: hidden;
  }
  .container {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
  }
  .bg-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center bottom;
    display: block;
  }
  .scenery-darkener {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    background-color: rgba(0, 0, 0, 0.22);
  }
</style>
</head>
<body>
  <div class="container">
    <img src="../background.png" class="bg-img" alt="Background">
    <div class="scenery-darkener" id="darkener"></div>
  </div>
</body>
</html>
