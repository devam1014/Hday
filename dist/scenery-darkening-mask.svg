<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 940" width="100%" height="100%">
  <defs>
    <mask id="sceneryMask">
      <!-- White base: Scenery gets 22% darkening -->
      <rect width="1672" height="940" fill="white"/>

      <!-- 1. Lower-Right Lamp (Head & Glow) -->
      <radialGradient id="lampBulb" cx="1380" cy="540" r="420" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="black" stop-opacity="1"/>
        <stop offset="60%" stop-color="black" stop-opacity="1"/>
        <stop offset="85%" stop-color="black" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="black" stop-opacity="0"/>
      </radialGradient>
      <circle cx="1380" cy="540" r="420" fill="url(#lampBulb)"/>

      <!-- 2. Lower-Right Lamp Table & Balcony Floor Glow -->
      <radialGradient id="lampBase" cx="1450" cy="720" r="340" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="black" stop-opacity="1"/>
        <stop offset="55%" stop-color="black" stop-opacity="1"/>
        <stop offset="80%" stop-color="black" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="black" stop-opacity="0"/>
      </radialGradient>
      <circle cx="1450" cy="720" r="340" fill="url(#lampBase)"/>

      <!-- 3. Lower-Left Lantern & Floor Reflection -->
      <radialGradient id="lanternHole" cx="170" cy="640" r="280" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="black" stop-opacity="1"/>
        <stop offset="55%" stop-color="black" stop-opacity="1"/>
        <stop offset="80%" stop-color="black" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="black" stop-opacity="0"/>
      </radialGradient>
      <circle cx="170" cy="640" r="280" fill="url(#lanternHole)"/>

      <!-- 4. Left Hanging Bulbs & Fairy Lights (Top Cluster) -->
      <radialGradient id="leftBulbsTop" cx="120" cy="120" r="240" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="black" stop-opacity="1"/>
        <stop offset="55%" stop-color="black" stop-opacity="1"/>
        <stop offset="80%" stop-color="black" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="black" stop-opacity="0"/>
      </radialGradient>
      <circle cx="120" cy="120" r="240" fill="url(#leftBulbsTop)"/>

      <!-- 5. Left Hanging Bulbs & Fairy Lights (Mid-Lower Cluster) -->
      <radialGradient id="leftBulbsMid" cx="120" cy="360" r="230" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="black" stop-opacity="1"/>
        <stop offset="55%" stop-color="black" stop-opacity="1"/>
        <stop offset="80%" stop-color="black" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="black" stop-opacity="0"/>
      </radialGradient>
      <circle cx="120" cy="360" r="230" fill="url(#leftBulbsMid)"/>

      <!-- 6. Left Hanging Garland Canopy Arch (Upper-Right Vine) -->
      <radialGradient id="leftBulbsVine" cx="300" cy="180" r="200" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="black" stop-opacity="1"/>
        <stop offset="50%" stop-color="black" stop-opacity="1"/>
        <stop offset="80%" stop-color="black" stop-opacity="0.5"/>
        <stop offset="100%" stop-color="black" stop-opacity="0"/>
      </radialGradient>
      <circle cx="300" cy="180" r="200" fill="url(#leftBulbsVine)"/>

      <!-- 7. Balustrade Garland Fairylight Strand -->
      <radialGradient id="leftRailingStrand" cx="380" cy="370" r="170" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="black" stop-opacity="1"/>
        <stop offset="50%" stop-color="black" stop-opacity="0.9"/>
        <stop offset="80%" stop-color="black" stop-opacity="0.4"/>
        <stop offset="100%" stop-color="black" stop-opacity="0"/>
      </radialGradient>
      <circle cx="380" cy="370" r="170" fill="url(#leftRailingStrand)"/>
    </mask>
  </defs>
  <!-- 22% Black Scenery Darkening Overlay, masked to leave lights 100% bright -->
  <rect width="1672" height="940" fill="#000000" fill-opacity="0.22" mask="url(#sceneryMask)"/>
</svg>